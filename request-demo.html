<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Demo - VIZBID</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mobile-header">
    <div class="mobile-brand">VIZBID <span>// BD</span></div>
    <button class="mobile-menu-btn" onclick="toggleNav()" aria-label="Toggle Navigation">
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="brand-wrapper">
        <a href="index.html" style="text-decoration:none;">
          <div class="brand-box">
            <h1>VIZBID</h1>
            <p>Visual Business Development</p>
          </div>
        </a>
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-item">Home</a>
        <a href="about.html" class="nav-item">About Us</a>
        <a href="products.html" class="nav-item active">Products</a>
        <a href="contact.html" class="nav-item">Contact Us</a>
      </nav>
    </aside>

    <main class="content-wrapper">
      <section class="content-well">
        
        <div id="demo-form-wrapper" class="form-card">
          <div class="form-header-bar">
            <h2>Request Demo</h2>
          </div>
          <form id="demoForm" onsubmit="handleDemoSubmit(event)">
            
            <div class="checkbox-selector-group">
              <label class="custom-checkbox-label">
                <input type="checkbox" name="tier" value="business">
                <span>Business</span>
              </label>
              <label class="custom-checkbox-label">
                <input type="checkbox" name="tier" value="enterprise">
                <span>Enterprise</span>
              </label>
            </div>

            <div class="form-group-row">
              <div class="form-group">
                <label for="demoFirstName">First Name</label>
                <input type="text" id="demoFirstName" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="demoLastName">Last Name</label>
                <input type="text" id="demoLastName" class="form-control" required>
              </div>
            </div>

            <div class="form-group">
              <label for="demoEmail">Email</label>
              <input type="email" id="demoEmail" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="demoCompany">Company Name</label>
              <input type="text" id="demoCompany" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="demoMessage">Message</label>
              <textarea id="demoMessage" class="form-control" required></textarea>
            </div>

            <div style="text-align: center; margin-top: 2rem;">
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>
          </form>
        </div>

        <div id="demo-success" class="state-message-sent">
          <h3>Demo Requested</h3>
          <p>We’ll be in touch!</p>
        </div>

      </section>
    </main>
  </div>

  <script>
    function toggleNav() {
      document.getElementById('sidebar').classList.toggle('mobile-open');
    }

    function handleDemoSubmit(e) {
      e.preventDefault();
      document.getElementById('demo-form-wrapper').style.display = 'none';
      document.getElementById('demo-success').classList.add('active');
    }
  </script>
</body>
</html>
