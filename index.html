<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniBid Analytics - Visual Business Development</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="mobile-header">
    <div class="mobile-brand">
      <span class="brand-name">OmniBid</span>
      <span class="brand-sub">ANALYTICS</span>
    </div>
    <button class="mobile-menu-btn" onclick="toggleNav()" aria-label="Toggle Navigation">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      
      <div class="brand-wrapper">
        <a href="index.html" class="glass-logo-box">
          <div class="logo-inner">
            <span class="logo-title">OmniBid</span>
            <div class="logo-divider-row">
              <span class="logo-line"></span>
              <span class="logo-sub">ANALYTICS</span>
              <span class="logo-line"></span>
            </div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item active">
          <span class="nav-label">HOME</span>
        </a>
        <a href="products.html" class="nav-item">
          <span class="nav-label">PRODUCTS</span>
        </a>
        <a href="about.html" class="nav-item">
          <span class="nav-label">ABOUT US</span>
        </a>
        <a href="contact.html" class="nav-item">
          <span class="nav-label">CONTACT</span>
        </a>
      </nav>
    </aside>

    <main class="main-canvas">
      <div class="canvas-image-container">
        <svg class="placeholder-graphic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3" ry="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
    </main>
  </div>

  <script>
    function toggleNav() {
      document.getElementById('sidebar').classList.toggle('mobile-open');
    }
  </script>
</body>
</html>
