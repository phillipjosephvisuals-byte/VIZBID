<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - OmniBid Analytics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="mobile-header">
    <div class="mobile-brand">
      <span class="brand-name">OmniBid</span>
      <span class="brand-sub">ANALYTICS</span>
    </div>
    <button class="mobile-menu-btn" onclick="toggleNav()" aria-label="Toggle Navigation">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      
      <div class="brand-container">
        <a href="index.html" class="glass-logo-box">
          <div class="logo-inner">
            <span class="logo-title">OmniBid</span>
            <div class="logo-divider-row">
              <span class="logo-line"></span>
              <span class="logo-sub">ANALYTICS</span>
              <span class="logo-line"></span>
            </div>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <span class="nav-label">HOME</span>
        </a>
        <a href="products.html" class="nav-item">
          <span class="nav-label">PRODUCTS</span>
        </a>
        <a href="about.html" class="nav-item">
          <span class="nav-label">ABOUT US</span>
        </a>
        <a href="contact.html" class="nav-item">
          <span class="nav-label">CONTACT</span>
        </a>
      </nav>
    </aside>

    <main class="main-canvas">
      <section class="content-well">
        
        <div id="contact-form-wrapper" class="form-card">
          <h1 class="page-title">Contact Us</h1>
          <p class="lead-text">Have questions about our analytics engine or custom integrations? Send our BD team a message.</p>

          <form id="contactForm" onsubmit="handleContactSubmit(event)">
            <div class="form-group-row">
              <div class="form-group">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" id="firstName" class="form-control" required>
              </div>
              <div class="form-group">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" id="lastName" class="form-control" required>
              </div>
            </div>

            <div class="form-group">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" id="subject" class="form-control" required>
            </div>

            <div class="form-group">
              <label for="message" class="form-label">Message</label>
              <textarea id="message" class="form-control" rows="5" required></textarea>
            </div>

            <div class="form-action-row">
              <button type="submit" class="btn btn-primary">Send Message</button>
            </div>
          </form>
        </div>

        <div id="contact-success" class="state-message-sent">
          <div class="success-icon-wrap">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
          </div>
          <h2 class="page-title">Message Sent!</h2>
          <p class="lead-text">Thank you for reaching out. An OmniBid specialist will review your inquiry and follow up shortly.</p>
        </div>

      </section>
    </main>
  </div>

  <script>
    function toggleNav() {
      document.getElementById('sidebar').classList.toggle('mobile-open');
    }

    function handleContactSubmit(e) {
      e.preventDefault();
      document.getElementById('contact-form-wrapper').style.display = 'none';
      document.getElementById('contact-success').classList.add('active');
    }
  </script>
</body>
</html>
